<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wayfarer</title>
<style>
html,body{margin:0;height:100%;background:#101711;color:#d8e0c8;font-family:ui-monospace,Menlo,Consolas,monospace}
body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}

<h1>WAYFARER</h1>
<p>The game could not be reached. The first time you open the app it needs an internet connection to download Wayfarer; after that it also plays offline.</p>
<p>Check your connection, then try again.</p>
<button id="retry">Try again</button>
</main><script>document.getElementById('retry').addEventListener('click', function () { location.replace('__GAME_URL__'); });</script></body></html>
