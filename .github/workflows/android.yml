name: Android debug APK

# Builds an installable (sideloadable) debug APK on GitHub's servers.
# Run it from the Actions tab ("Run workflow"), or it runs on pushes that change the game or the Android project.
on:
  workflow_dispatch:
  push:
    paths:
      - 'wayfarer.html'
      - 'gfx.js'
      - 'settlement.js'
      - 'war.js'
      - 'dark.js'
      - 'towns.js'
      - 'touch.js'
      - 'assets/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'scripts/build-web.cjs'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes a package ("tools") that Google's SDK manager no longer ships,
          # which made the step fail. Ask only for what the build needs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci --ignore-scripts
      - run: npm run android:sync
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: wayfarer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
